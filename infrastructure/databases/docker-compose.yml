services:
  database-departamentos:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DEPARTAMENTOS_DB_NAME:-gestion_departamentos}
      POSTGRES_USER: ${DEPARTAMENTOS_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DEPARTAMENTOS_DB_PASSWORD:-postgres}
    volumes:
      - departamentos_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEPARTAMENTOS_DB_USER:-postgres} -d ${DEPARTAMENTOS_DB_NAME:-gestion_departamentos}"]
      interval: 5s
      timeout: 15s
      retries: 10
      start_period: 120s
    networks:
      - microservices-network

  database-empleados:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${EMPLEADOS_DB_NAME:-gestion_empleados}
      POSTGRES_USER: ${EMPLEADOS_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${EMPLEADOS_DB_PASSWORD:-postgres}
    volumes:
      - empleados_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EMPLEADOS_DB_USER:-postgres} -d ${EMPLEADOS_DB_NAME:-gestion_empleados}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - microservices-network

  database-perfiles:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PERFILES_DB_NAME:-gestion_perfiles}
      POSTGRES_USER: ${PERFILES_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${PERFILES_DB_PASSWORD:-postgres}
    volumes:
      - perfiles_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PERFILES_DB_USER:-postgres} -d ${PERFILES_DB_NAME:-gestion_perfiles}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - microservices-network

  database-notificaciones:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NOTIFICACIONES_DB_NAME:-gestion_notificaciones}
      POSTGRES_USER: ${NOTIFICACIONES_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${NOTIFICACIONES_DB_PASSWORD:-postgres}
    volumes:
      - notificaciones_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOTIFICACIONES_DB_USER:-postgres} -d ${NOTIFICACIONES_DB_NAME:-gestion_notificaciones}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - microservices-network

  db-vacaciones:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${VACACIONES_DB_NAME:-gestion_vacaciones}
      POSTGRES_USER: ${VACACIONES_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${VACACIONES_DB_PASSWORD:-postgres}
    volumes:
      - vacaciones_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VACACIONES_DB_USER:-postgres} -d ${VACACIONES_DB_NAME:-gestion_vacaciones}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - microservices-network

  db-auth:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-gestion_auth}
      POSTGRES_USER: ${AUTH_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-postgres}
    volumes:
      - auth_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER:-postgres} -d ${AUTH_DB_NAME:-gestion_auth}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - microservices-network

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin}
      # Carga automática de exchange, colas y bindings al iniciar
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: >-
        -rabbitmq_management load_definitions "/etc/rabbitmq/definitions.json"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ../../infrastructure/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - microservices-network

networks:
  microservices-network:
    name: sistema_rrhh_network

volumes:
  departamentos_data:
    name: gestion-departamentos_postgres_data

  empleados_data:
    name: gestion-empleados_postgres_data

  perfiles_data:
    name: gestion-perfiles_postgres_data

  notificaciones_data:
    name: gestion-notificaciones_postgres_data

  vacaciones_data:
    name: gestion-vacaciones_postgres_data

  auth_data:
    name: gestion-auth_postgres_data

  rabbitmq_data:
    name: sistema_rrhh_rabbitmq_data
