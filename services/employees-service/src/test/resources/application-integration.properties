# Perfil de las pruebas de integración con Testcontainers.
#
# La URL, el usuario y la contraseña NO se definen aquí: los aporta
# @ServiceConnection a partir del contenedor que Testcontainers levanta.
# Lo que sí se fija es que el esquema lo cree Flyway con las mismas migraciones
# de producción, en lugar de que Hibernate lo genere: así la prueba verifica el
# esquema real y no uno inventado por el ORM.
spring.flyway.enabled=true
spring.flyway.clean-disabled=false
spring.jpa.hibernate.ddl-auto=validate

# El broker no está disponible: el listener no debe intentar conectarse.
spring.rabbitmq.listener.simple.auto-startup=false

# Sin servidor HTTP: esta prueba va directa al repositorio.
spring.main.web-application-type=none
