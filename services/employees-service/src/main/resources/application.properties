server.port=8080

# Identidad del servicio. Micrometer la usa como etiqueta 'application' en las
# métricas y Micrometer Tracing como service.name en las trazas, que es el
# nombre con el que aparece en la UI de Zipkin.
spring.application.name=${OTEL_SERVICE_NAME:employees-service}

# ── Observabilidad (Reto 8) ──────────────────────────────────────────────────

# Endpoints de Actuator que se publican. Se exponen solo los necesarios: dejar
# abiertos env, beans o heapdump filtraría configuración y datos internos.
management.endpoints.web.exposure.include=health,info,prometheus,metrics
# El /actuator/health detallado muestra el estado de PostgreSQL y RabbitMQ por
# separado, que es justo lo que pide el enunciado: no un "status: ok" vacío.
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
# Permite que /actuator/health devuelva 503 cuando una dependencia está caída.
management.endpoint.health.status.http-mapping.down=503
management.endpoint.health.status.http-mapping.out-of-service=503

# Histograma de latencias de las peticiones HTTP. Sin esto Micrometer solo
# publica el total y la suma, y no se pueden calcular percentiles (p95, p99) en
# PromQL con histogram_quantile.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=50ms,100ms,300ms,500ms,1s,2s

# Muestreo de trazas al 100%. Es lo correcto en desarrollo y en QA, donde se
# quiere visibilidad total. En producción esto sería head-based sampling del
# 10-20%, o tail-based en un OTel Collector para conservar el 100% de las
# trazas con error; está justificado en el README.
management.tracing.sampling.probability=${OTEL_TRACES_SAMPLER_ARG:1.0}

# Destino de los spans. Nombre de red de Docker, nunca localhost: dentro del
# contenedor localhost sería el propio servicio.
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://zipkin:9411/api/v2/spans}

# Propagación del contexto de traza a través de RabbitMQ.
#
# Spring AMQP sabe inyectar la cabecera traceparent al publicar y extraerla al
# consumir, pero las dos opciones vienen DESACTIVADAS por omisión. Sin ellas la
# traza se corta en el broker: el evento empleado.creado llega a auth-service
# sin contexto y toda la cadena asíncrona del onboarding aparece en Zipkin como
# trazas sueltas. Es el mismo problema que en los servicios Node, donde hay que
# inyectar y extraer a mano porque su SDK no trae instrumentación de amqplib
# equivalente.
spring.rabbitmq.template.observation-enabled=true
spring.rabbitmq.listener.simple.observation-enabled=true

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/gestion_empleados}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
departments.service.url=${DEPARTMENTS_SERVICE_URL:http://localhost:8081}
# TTL del caché de contingencia de departamentos (en minutos). Una entrada válida del caché
# se usa como fallback únicamente cuando departments-service está indisponible.
# El TTL se mide desde la última respuesta real exitosa, no desde el inicio de la falla.
departments.cache.ttl-minutes=${DEPARTMENTS_CACHE_TTL_MINUTES:30}

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin}

# Lanza NoHandlerFoundException para rutas no definidas
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Serializar LocalDate como "yyyy-MM-dd" en lugar de timestamp
spring.jackson.serialization.write-dates-as-timestamps=false

# Three consecutive failed HTTP operations (including their retries) open the circuit.
resilience4j.circuitbreaker.instances.departmentsCircuitBreaker.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.departmentsCircuitBreaker.sliding-window-size=3
resilience4j.circuitbreaker.instances.departmentsCircuitBreaker.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.departmentsCircuitBreaker.failure-rate-threshold=100
resilience4j.circuitbreaker.instances.departmentsCircuitBreaker.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.departmentsCircuitBreaker.permitted-number-of-calls-in-half-open-state=1
resilience4j.circuitbreaker.instances.departmentsCircuitBreaker.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.departmentsCircuitBreaker.record-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException

# Intervalo del publicador del outbox.
#
# 1 s y no los 5 s del valor por omision del codigo, por dos razones: es el mismo
# que usan los publicadores de auth-service y vacations-service, y la demora se
# nota en todo lo que depende de la cadena de alta. Con 5 s, las colecciones de
# Postman que consultan el perfil o la cuenta justo despues de crear al empleado
# fallaban por tiempo: el evento aun no habia salido.
outbox.intervalo-ms=1000
outbox.retraso-inicial-ms=2000
