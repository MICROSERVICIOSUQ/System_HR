server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/gestion_empleados}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
departments.service.url=${DEPARTMENTS_SERVICE_URL:http://localhost:8081}

# Lanza NoHandlerFoundException para rutas no definidas
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Serializar LocalDate como "yyyy-MM-dd" en lugar de timestamp
spring.jackson.serialization.write-dates-as-timestamps=false

# Configuración de Resilience4j en formato properties
resilience4j.circuitbreaker.instances.departmentsCircuitBreaker.register-health-indicator=true
resilience4j.circuitbreaker.instances.departmentsCircuitBreaker.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.departmentsCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.departmentsCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.departmentsCircuitBreaker.slow-call-rate-threshold=50
resilience4j.circuitbreaker.instances.departmentsCircuitBreaker.slow-call-duration-threshold=5s
resilience4j.circuitbreaker.instances.departmentsCircuitBreaker.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.departmentsCircuitBreaker.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.departmentsCircuitBreaker.automatic-transition-from-open-to-half-open-enabled=true