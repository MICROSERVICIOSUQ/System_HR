sonar.projectKey=profiles-service
sonar.projectName=System HR Profiles
sonar.sources=src
sonar.tests=src/tests
sonar.exclusions=src/tests/**,src/generated/**
# El mismo alcance que mide 'npm test': servicio, controlador, mapeador, errores
# y contrato. Sin estas exclusiones SonarQube reparte la cobertura entre el
# cableado que las pruebas unitarias no tocan a propósito —arranque, Prisma,
# mensajería, instrumentación— y el Quality Gate rechaza el servicio aunque sus
# pruebas estén por encima del umbral. Es el criterio que ya usa
# vacations-service.
sonar.coverage.exclusions=src/app.ts,src/server.ts,src/config/**,src/repositories/**,src/messaging/**,src/observability/**,src/routes/**,src/generated/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.qualitygate.wait=true
# Quality Gate: cobertura mínima del 70%, configurada en SonarQube.
sonar.sourceEncoding=UTF-8
