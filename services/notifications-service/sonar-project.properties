# notifications-service y no system-hr-notifications: es la clave que
# ci/configurar-sonar.py crea y a la que asocia el Quality Gate RRHH-70. Con la
# otra, el escaner auto-creaba un proyecto distinto al que SonarQube aplicaba su
# puerta por omision, de modo que el umbral del 70 % de la auditoria no se
# estaba aplicando a este servicio.
sonar.projectKey=notifications-service
sonar.projectName=System HR Notificaciones Go
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/*_test.go,reports/**
sonar.go.coverage.reportPaths=coverage.out
sonar.qualitygate.wait=true
# Quality Gate: cobertura mínima del 70%, configurada en SonarQube.
sonar.sourceEncoding=UTF-8
