spring.datasource.url=jdbc:h2:mem:auth;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

jwt.secret=secreto-de-pruebas-con-mas-de-treinta-y-dos-bytes
jwt.issuer=system-hr-auth-test
jwt.access-token-ttl-seconds=3600
jwt.reset-token-ttl-seconds=3600

auth.seed-admin.empleado-id=admin
auth.seed-admin.email=admin@empresa.com
auth.seed-admin.password=Admin12345

# El broker no está disponible en las pruebas. No se excluye la autoconfiguración
# de AMQP —RabbitMQConfig necesita el ConnectionFactory para construir el
# RabbitTemplate— pero la conexión es perezosa y nunca se abre: el listener no
# arranca y el publisher se sustituye por un mock en cada test.
spring.rabbitmq.listener.simple.auto-startup=false

# ── Observabilidad en pruebas (Reto 8) ───────────────────────────────────────
# Las trazas NO se exportan durante las pruebas.
#
# Una prueba no debe depender de que exista un Zipkin al que enviar spans: la
# haría fallar por una razón ajena a lo que esta comprobando, y en un agente de
# CI sin ese contenedor no arrancaria siquiera el contexto de Spring. El
# exportador de Zipkin abre su conexion al construirse, de modo que su simple
# presencia en el contexto es suficiente para romperlo.
#
# La instrumentacion de trazas se verifica donde tiene sentido verificarla: de
# extremo a extremo, contra el ecosistema desplegado y mirando la cascada en la
# UI de Zipkin.
management.tracing.enabled=false

# Las metricas si se dejan activas: Micrometer las acumula en memoria sin
# dependencias externas, y asi /actuator/prometheus sigue siendo verificable.

# management.tracing.enabled no alcanza al exportador: la auto-configuracion de
# Zipkin se controla con su propia propiedad, y su sender abre la conexion al
# construirse.
management.zipkin.tracing.export.enabled=false

# La propiedad anterior no basta: el sender de Zipkin se instancia desde
# ZipkinConfigurations$RestTemplateSenderConfiguration y abre la conexion en el
# metodo de fabrica, antes de que cualquier condicion lo desactive. Excluir la
# auto-configuracion completa es la unica forma de que no llegue al contexto.
spring.autoconfigure.exclude=org.springframework.boot.actuate.autoconfigure.tracing.zipkin.ZipkinAutoConfiguration
