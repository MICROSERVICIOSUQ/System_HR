spring.datasource.url=jdbc:h2:mem:auth;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

jwt.secret=secreto-de-pruebas-con-mas-de-treinta-y-dos-bytes
jwt.issuer=system-hr-auth-test
jwt.access-token-ttl-seconds=3600
jwt.reset-token-ttl-seconds=3600

auth.seed-admin.empleado-id=admin
auth.seed-admin.email=admin@empresa.com
auth.seed-admin.password=Admin12345

# El broker no está disponible en las pruebas. No se excluye la autoconfiguración
# de AMQP —RabbitMQConfig necesita el ConnectionFactory para construir el
# RabbitTemplate— pero la conexión es perezosa y nunca se abre: el listener no
# arranca y el publisher se sustituye por un mock en cada test.
spring.rabbitmq.listener.simple.auto-startup=false
