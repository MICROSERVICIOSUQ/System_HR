server.port=${SERVER_PORT:8085}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/gestion_auth}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000

# ── JWT ──────────────────────────────────────────────────────────────────────
# Secreto simétrico HS256 compartido con el api-gateway, que es quien valida la
# firma de las peticiones entrantes. Mínimo 32 bytes. Se inyecta por entorno:
# nunca debe quedar quemado en el código.
jwt.secret=${JWT_SECRET:cambie-este-secreto-de-desarrollo-por-uno-de-32-bytes-o-mas}
jwt.issuer=${JWT_ISSUER:system-hr-auth}
# Vigencia del Access JWT (1 hora por defecto).
jwt.access-token-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:3600}
# Vigencia del token de activación/recuperación. El enunciado pide expiración
# corta (15 minutos a 1 hora); se usa 1 hora para dar margen en la sustentación.
jwt.reset-token-ttl-seconds=${JWT_RESET_TTL_SECONDS:3600}

# ── Administrador semilla ────────────────────────────────────────────────────
# Sin esta cuenta no habría forma de ejecutar ninguna operación de escritura:
# las cuentas de empleado nacen con rol USER.
auth.seed-admin.empleado-id=${AUTH_SEED_ADMIN_ID:admin}
auth.seed-admin.email=${AUTH_SEED_ADMIN_EMAIL:admin@empresa.com}
auth.seed-admin.password=${AUTH_SEED_ADMIN_PASSWORD:Admin12345}

# ── RabbitMQ ─────────────────────────────────────────────────────────────────
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin}
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Lanza NoHandlerFoundException para rutas no definidas
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

spring.jackson.serialization.write-dates-as-timestamps=false

management.endpoints.web.exposure.include=health
