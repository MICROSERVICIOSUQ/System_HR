server.port=${SERVER_PORT:8085}

# Nombre con el que este servicio aparece en las métricas (etiqueta
# 'application') y en la UI de Zipkin (service.name de OpenTelemetry).
spring.application.name=${OTEL_SERVICE_NAME:auth-service}

# ── Observabilidad (Reto 8) ──────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.health.status.http-mapping.down=503
management.endpoint.health.status.http-mapping.out-of-service=503

# Histograma necesario para calcular percentiles de latencia en PromQL.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=50ms,100ms,300ms,500ms,1s,2s

# 100% en desarrollo; en producción, muestreo parcial (ver README).
management.tracing.sampling.probability=${OTEL_TRACES_SAMPLER_ARG:1.0}
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://zipkin:9411/api/v2/spans}

# Propagación del contexto de traza por RabbitMQ. Las dos opciones vienen
# desactivadas por omisión en Spring Boot; sin ellas este servicio —que es
# consumidor de empleado.creado y de vacaciones.iniciadas, y productor de
# usuario.creado y cuenta.desactivada— rompería la traza dos veces: al recibir y
# al reenviar.
spring.rabbitmq.template.observation-enabled=true
spring.rabbitmq.listener.simple.observation-enabled=true

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/gestion_auth}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000

# ── JWT ──────────────────────────────────────────────────────────────────────
# Secreto simétrico HS256 compartido con el api-gateway, que es quien valida la
# firma de las peticiones entrantes. Mínimo 32 bytes. Se inyecta por entorno:
# nunca debe quedar quemado en el código.
jwt.secret=${JWT_SECRET:cambie-este-secreto-de-desarrollo-por-uno-de-32-bytes-o-mas}
jwt.issuer=${JWT_ISSUER:system-hr-auth}
# Vigencia del Access JWT (1 hora por defecto).
jwt.access-token-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:3600}
# Vigencia del token de activación/recuperación. El enunciado pide expiración
# corta (15 minutos a 1 hora); se usa 1 hora para dar margen en la sustentación.
jwt.reset-token-ttl-seconds=${JWT_RESET_TTL_SECONDS:3600}

# ── Administrador semilla ────────────────────────────────────────────────────
# Sin esta cuenta no habría forma de ejecutar ninguna operación de escritura:
# las cuentas de empleado nacen con rol USER.
auth.seed-admin.empleado-id=${AUTH_SEED_ADMIN_ID:admin}
auth.seed-admin.email=${AUTH_SEED_ADMIN_EMAIL:admin@empresa.com}
auth.seed-admin.password=${AUTH_SEED_ADMIN_PASSWORD:Admin12345}

# ── RabbitMQ ─────────────────────────────────────────────────────────────────
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin}
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Lanza NoHandlerFoundException para rutas no definidas
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

spring.jackson.serialization.write-dates-as-timestamps=false

# La exposición de endpoints de Actuator se configura arriba, en el bloque de
# observabilidad. Aquí había una segunda declaración con solo 'health' que, al
# ser la última, ganaba y dejaba /actuator/prometheus en 404.
