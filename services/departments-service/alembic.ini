; Alembic sustituye a Prisma Migrate como herramienta de migraciones.
;
; El ADR-002 del proyecto exige migraciones versionadas y no generación
; automática del esquema desde el modelo. Alembic es el equivalente de Flyway
; (Java) y de Prisma Migrate (Node) en Python, así que la decisión se mantiene
; aunque cambie el lenguaje: el esquema sigue siendo un artefacto versionado y
; revisable, no un efecto secundario del arranque.
;
; La URL no está aquí: la lee env.py de DATABASE_URL, igual que la aplicación.
; Escribirla en este archivo pondría credenciales en el repositorio.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
