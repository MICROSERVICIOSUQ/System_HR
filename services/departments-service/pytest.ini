; Configuración de las pruebas de departments-service.
;
; La cobertura se exporta en dos formatos a propósito:
;   - XML de Cobertura, que es el que consumen Jenkins y SonarQube, igual que el
;     XML de JaCoCo en los servicios Java y el lcov en los de Node.
;   - terminal, para verla sin abrir nada.
;
; El umbral del 70% se aplica aquí y rompe el comando si no se alcanza, igual que
; el gate de JaCoCo en employees-service. Un umbral que no falla el build es solo
; una sugerencia.

[pytest]
testpaths = tests
pythonpath = .
asyncio_default_fixture_loop_scope = function

addopts =
    --strict-markers
    --cov=app
    --cov-report=term-missing
    --cov-report=xml:reports/coverage.xml
    --cov-fail-under=70

; Se excluyen de la cobertura las piezas de arranque y de infraestructura, con el
; mismo criterio que en los otros servicios: en Java quedan fuera la clase
; Application, config y los DTO, y en Node el server y la configuración. Lo que
; se mide es la lógica: servicio, repositorio, esquemas y errores.
