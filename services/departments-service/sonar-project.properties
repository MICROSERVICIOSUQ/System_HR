sonar.projectKey=departments-service
sonar.projectName=System HR Departments
sonar.sources=app
sonar.tests=tests
# sonar.sources era '.', de modo que el análisis incluía migrations/, el propio
# tests/ y hasta .venv/ si existía en el workspace. pytest mide solo app/ con
# --cov=app, así que SonarQube repartía esa cobertura entre muchas más líneas:
# el primer análisis dio 30,1 % con pruebas al 80,18 % y el Quality Gate
# rechazaba un servicio correcto. El alcance del analizador tiene que ser el
# mismo que el de las pruebas.
sonar.exclusions=.venv/**,migrations/**,reports/**,htmlcov/**
# Mismas exclusiones que .coveragerc: se mide la lógica, no el cableado.
sonar.coverage.exclusions=app/main.py,app/db.py,app/observability/**
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.qualitygate.wait=true
# Quality Gate: cobertura mínima del 70%, configurada en SonarQube.
sonar.sourceEncoding=UTF-8
