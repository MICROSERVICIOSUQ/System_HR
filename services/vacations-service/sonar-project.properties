sonar.projectKey=vacations-service
sonar.projectName=Vacaciones
sonar.sources=src
sonar.tests=src/tests
sonar.exclusions=src/tests/**,src/generated/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.qualitygate.wait=true
# Quality Gate: cobertura mínima del 70%, configurada en SonarQube.
# La cobertura unitaria mide dominio y servicios. Los adaptadores se verifican en E2E.
# Mismo alcance que las pruebas del reto 6: la infraestructura se verifica en E2E.
sonar.coverage.exclusions=src/app.ts,src/server.ts,src/config/**,src/controllers/**,src/routes/**,src/scheduler/**,src/middlewares/**,src/types/**,src/repositories/**,src/messaging/**,src/generated/**
sonar.sourceEncoding=UTF-8

# El analizador de SonarQube usa una configuración compatible con su TypeScript.
sonar.typescript.tsconfigPaths=tsconfig.sonar.json
