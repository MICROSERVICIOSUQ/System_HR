include:
  - ./infrastructure/databases/docker-compose.yml

services:
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      # Único puerto publicado al host: el borde. Los demás servicios usan
      # 'expose', lo que impide esquivar la validación del JWT (ADR-008).
      - "${GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "--silent", "http://localhost:8080/health"]
      # Es el último en arrancar, cuando los demás JVM ya tienen la CPU ocupada.
      interval: 10s
      timeout: 10s
      start_period: 120s
      retries: 10
    environment:
      - EMPLEADOS_URL=http://employees-service:${EMPLEADOS_PORT:-8080}
      - DEPARTAMENTOS_URL=http://departments-service:${DEPARTAMENTOS_PORT:-8081}
      - NOTIFICACIONES_URL=http://notifications-service:${NOTIFICACIONES_PORT:-8082}
      - PERFILES_URL=http://profiles-service:${PERFILES_PORT:-8083}
      - VACACIONES_URL=http://vacations-service:${VACACIONES_PORT:-8084}
      - AUTH_URL=http://auth-service:${AUTH_PORT:-8085}
      # El gateway valida la firma del JWT en el borde: necesita el mismo
      # secreto simétrico con el que auth-service firma (Reto 5, ADR-008).
      - JWT_SECRET=${JWT_SECRET:?Defina JWT_SECRET en .env (mínimo 32 caracteres)}
      - JWT_ISSUER=${JWT_ISSUER:-system-hr-auth}
    depends_on:
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - frontend-gateway-net
      - microservices-net
    restart: unless-stopped

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: ${AUTH_PORT:-8085}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-auth:5432/${AUTH_DB_NAME:-gestion_auth}
      SPRING_DATASOURCE_USERNAME: ${AUTH_DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD:-postgres}
      SPRING_JPA_DDL_AUTO: validate
      # Secreto de firma. Falla el arranque si no está definido: es preferible
      # a emitir tokens firmados con un valor por defecto conocido.
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env (mínimo 32 caracteres)}
      JWT_ISSUER: ${JWT_ISSUER:-system-hr-auth}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-3600}
      JWT_RESET_TTL_SECONDS: ${JWT_RESET_TTL_SECONDS:-3600}
      # Administrador semilla: sin él no hay forma de ejecutar ninguna
      # operación de escritura, porque las cuentas de empleado nacen como USER.
      AUTH_SEED_ADMIN_ID: ${AUTH_SEED_ADMIN_ID:-admin}
      AUTH_SEED_ADMIN_EMAIL: ${AUTH_SEED_ADMIN_EMAIL:-admin@empresa.com}
      AUTH_SEED_ADMIN_PASSWORD: ${AUTH_SEED_ADMIN_PASSWORD:-Admin12345}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin}
    depends_on:
      db-auth:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    expose:
      - "${AUTH_PORT:-8085}"
    restart: unless-stopped
    healthcheck:
      # /health y no /auth/health: es la sonda estandarizada del ecosistema, la
      # que comprueba de verdad PostgreSQL y RabbitMQ y devuelve 503 cuando
      # alguno falla. /auth/health sigue existiendo por compatibilidad, pero
      # responde siempre 200 sin mirar sus dependencias, así que como healthcheck
      # de Docker daba una garantía falsa: el contenedor se declaraba sano con la
      # base de datos caída.
      test: ["CMD-SHELL", "curl -f --silent http://localhost:$${SERVER_PORT:-8085}/health"]
      # Mismo motivo que en employees-service: el arranque en frío de un JVM
      # con JPA, Flyway y RabbitMQ no cabe en el margen anterior.
      interval: 10s
      timeout: 10s
      start_period: 120s
      retries: 10
    networks:
      - microservices-net
      - data-broker-net

  departments-service:
    build:
      context: ./services/departments-service
      dockerfile: Dockerfile
    depends_on:
      database-departamentos:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${DEPARTAMENTOS_PORT:-8081}
      DATABASE_URL: postgresql://${DEPARTAMENTOS_DB_USER:-postgres}:${DEPARTAMENTOS_DB_PASSWORD:-postgres}@database-departamentos:5432/${DEPARTAMENTOS_DB_NAME:-gestion_departamentos}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin}@${RABBITMQ_HOST:-rabbitmq}:${RABBITMQ_PORT:-5672}
      EMPLOYEES_SERVICE_URL: http://employees-service:${EMPLEADOS_PORT:-8080}
    expose:
      - "${DEPARTAMENTOS_PORT:-8081}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f --silent http://localhost:$${PORT:-8081}/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - microservices-net
      - data-broker-net

  employees-service:
    build:
      context: ./services/employees-service
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: ${EMPLEADOS_PORT:-8080}
      SPRING_DATASOURCE_URL: jdbc:postgresql://database-empleados:5432/${EMPLEADOS_DB_NAME:-gestion_empleados}
      SPRING_DATASOURCE_USERNAME: ${EMPLEADOS_DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${EMPLEADOS_DB_PASSWORD:-postgres}
      SPRING_JPA_DDL_AUTO: validate
      DEPARTMENTS_SERVICE_URL: ${DEPARTMENTS_SERVICE_URL:-http://departments-service:${DEPARTAMENTOS_PORT:-8081}}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin}@${RABBITMQ_HOST:-rabbitmq}:${RABBITMQ_PORT:-5672}
    depends_on:
      database-empleados:
        condition: service_healthy
      departments-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    expose:
      - "${EMPLEADOS_PORT:-8080}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f --silent http://localhost:$${SERVER_PORT:-8080}/empleados/health"]
      # Arranque en frío medido: 37s este servicio solo, y más cuando los tres
      # JVM del stack arrancan a la vez y se pelean por la CPU. Con el
      # start_period anterior de 20s el margen total era de 110s y Compose lo
      # declaraba unhealthy mientras seguía arrancando. Los fallos dentro del
      # start_period no cuentan como caída; pasado ese plazo, 10 fallos
      # seguidos cada 10s siguen detectando una caída real en ~100s.
      interval: 10s
      timeout: 10s
      start_period: 120s
      retries: 10
    networks:
      - microservices-net
      - data-broker-net

  notifications-service:
    build:
      context: ./services/notifications-service
      dockerfile: Dockerfile
    depends_on:
      database-notificaciones:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      OTEL_EXPORTER_ZIPKIN_ENDPOINT: ${OTEL_EXPORTER_ZIPKIN_ENDPOINT:-}
      PORT: ${NOTIFICACIONES_PORT:-8082}
      DATABASE_URL: postgresql://${NOTIFICACIONES_DB_USER:-postgres}:${NOTIFICACIONES_DB_PASSWORD:-postgres}@database-notificaciones:5432/${NOTIFICACIONES_DB_NAME:-gestion_notificaciones}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin}
    expose:
      - "${NOTIFICACIONES_PORT:-8082}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f --silent http://localhost:$${PORT:-8082}/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - microservices-net
      - data-broker-net

  profiles-service:
    build:
      context: ./services/profiles-service
      dockerfile: Dockerfile
    depends_on:
      database-perfiles:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${PERFILES_PORT:-8083}
      DATABASE_URL: postgresql://${PERFILES_DB_USER:-postgres}:${PERFILES_DB_PASSWORD:-postgres}@database-perfiles:5432/${PERFILES_DB_NAME:-gestion_perfiles}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin}
    expose:
      - "${PERFILES_PORT:-8083}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f --silent http://localhost:$${PORT:-8083}/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - microservices-net
      - data-broker-net

  vacations-service:
    build:
      context: ./services/vacations-service
      dockerfile: Dockerfile
    depends_on:
      db-vacaciones:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      OTEL_EXPORTER_ZIPKIN_ENDPOINT: ${OTEL_EXPORTER_ZIPKIN_ENDPOINT:-}
      NODE_ENV: production
      PORT: ${VACACIONES_PORT:-8084}
      DATABASE_URL: postgresql://${VACACIONES_DB_USER:-postgres}:${VACACIONES_DB_PASSWORD:-postgres}@db-vacaciones:5432/${VACACIONES_DB_NAME:-gestion_vacaciones}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin}
      # Scheduler del Reto 5: cada minuto por defecto, para poder demostrar el
      # flujo sin esperar un día. Limitación de instancia única en el README.
      VACACIONES_CRON: ${VACACIONES_CRON:-* * * * *}
      VACACIONES_SCHEDULER_ENABLED: ${VACACIONES_SCHEDULER_ENABLED:-true}
    expose:
      - "${VACACIONES_PORT:-8084}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f --silent http://localhost:$${PORT:-8084}/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - microservices-net
      - data-broker-net

  bdd-tests:
    build:
      context: ./e2e-tests
      dockerfile: Dockerfile
    profiles:
      - testing
    environment:
      BASE_URL: http://api-gateway:8080
      ADMIN_USER: ${AUTH_SEED_ADMIN_EMAIL:-admin@empresa.com}
      ADMIN_PASSWORD: ${AUTH_SEED_ADMIN_PASSWORD:-Admin12345}
      REGULAR_USER: ${REGULAR_USER:-e2e}
      REGULAR_PASSWORD: ${REGULAR_PASSWORD:-Secreta123}
    volumes:
      - ./e2e-tests/reports:/app/reports
    depends_on:
      api-gateway:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      employees-service:
        condition: service_healthy
      departments-service:
        condition: service_healthy
      vacations-service:
        condition: service_healthy
      notifications-service:
        condition: service_healthy
    networks:
      - microservices-net

  jenkins:
    image: jenkins/jenkins:lts-jdk21
    ports:
      - "8081:8080"
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      CASC_JENKINS_CONFIG: /usr/share/jenkins/ref/casc.yaml
      SECRETS: /run/sonar
      JENKINS_ADMIN_USER: ${JENKINS_ADMIN_USER:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?Ejecute scripts/setup-secrets.sh}
      JENKINS_URL: ${JENKINS_URL:-http://localhost:9091/}
      JENKINS_RESOURCE_URL: ${JENKINS_RESOURCE_URL:-http://127.0.0.1:9091/}
      CI_NETWORK: ${CI_NETWORK:-system_hr_ci}
      CI_REPOSITORY_URL: ${CI_REPOSITORY_URL:-https://github.com/MICROSERVICIOSUQ/System_HR.git}
      CI_REPOSITORY_BRANCH: ${CI_REPOSITORY_BRANCH:-valentina}
    volumes:
      - jenkins_home:/var/jenkins_home
      - sonar_credentials:/run/sonar:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      sonar-setup:
        condition: service_completed_successfully
    networks:
      - ci-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f --silent http://localhost:8080/login"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5
    restart: unless-stopped

  sonarqube:
    image: sonarqube:10-community
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?Ejecute scripts/setup-secrets.sh}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    depends_on:
      sonar-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f --silent http://localhost:9000/api/system/status"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 10
    networks:
      - ci-network
      - data-broker-net
    restart: unless-stopped

  sonar-db:
    image: postgres:16
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?Ejecute scripts/setup-secrets.sh}
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U sonar -d sonar"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - data-broker-net
    restart: unless-stopped

  sonar-setup:
    build:
      context: .
      dockerfile: ci/Dockerfile.sonar-setup
    environment:
      SONAR_ADMIN_PASSWORD: ${SONAR_ADMIN_PASSWORD:?Ejecute scripts/setup-secrets.sh}
    volumes:
      - sonar_credentials:/run/sonar
    depends_on:
      sonarqube:
        condition: service_started
    networks:
      - ci-network

  # ──────────────────────────────────────────────────────────────────────────
  # Stack de observabilidad (Reto 8)
  #
  # Cinco contenedores en la MISMA red que los microservicios. Esa es la
  # condición que lo hace funcionar: Prometheus necesita resolver
  # 'employees-service' por DNS para raspar sus métricas, y los servicios
  # necesitan resolver 'zipkin' para enviar sus trazas. Si estuvieran en redes
  # distintas no se verían entre sí.
  #
  # Los puertos sí se publican al host, pero solo para que un humano abra las
  # interfaces desde el navegador. El tráfico entre contenedores nunca sale a
  # localhost.
  # ──────────────────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v3.1.0
    # Recolector de métricas. Modelo PULL: visita el endpoint de cada servicio
    # cada 15s. Lo que no esté en prometheus.yml, no se vigila.
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # 15 días es de sobra para un trabajo de curso y evita que el volumen
      # crezca sin control en una máquina de desarrollo.
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks:
      - microservices-net

  loki:
    image: grafana/loki:3.3.2
    # Almacén de logs. Indexa solo las etiquetas (service, level), no el
    # contenido, lo que lo hace mucho más liviano que Elasticsearch.
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10
    networks:
      - microservices-net

  promtail:
    image: grafana/promtail:3.3.2
    # Agente recolector. Descubre los contenedores por el socket de Docker y
    # empuja sus logs a Loki (modelo PUSH). Por eso necesita el socket montado.
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-data:/tmp
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - microservices-net

  zipkin:
    image: openzipkin/zipkin:3.4
    # Servidor de trazas distribuidas. Recibe los spans por PUSH desde cada
    # servicio y los reconstruye en una cascada por traceId.
    ports:
      - "${ZIPKIN_PORT:-9411}:9411"
    environment:
      # Almacenamiento en memoria: suficiente para el reto y no necesita otra
      # base de datos. Las trazas se pierden al reiniciar, lo que está
      # documentado como limitación en el README.
      STORAGE_TYPE: mem
      JAVA_OPTS: -Xms256m -Xmx512m
    restart: unless-stopped
    networks:
      - microservices-net

  grafana:
    image: grafana/grafana:11.5.1
    # Visualización y alertas. Lee sus fuentes de datos, su dashboard y sus
    # reglas de alerta de los archivos de ./observability/grafana/provisioning,
    # así que no hay que configurar nada a mano tras un docker compose up.
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Zona horaria del proceso. Sin esto el contenedor corre en UTC y el
      # mensaje de alerta llega con una hora que no es la de quien lo lee: a las
      # 16:06 de Colombia avisaba de un incidente "desde las 21:07". Una alerta
      # con la hora equivocada es peor que inútil, porque hace buscar la causa en
      # el momento equivocado.
      TZ: ${TZ:-America/Bogota}
      # URL del webhook de Discord al que se envían las alertas. Se inyecta por
      # entorno y NO se versiona: un webhook es una credencial — quien lo tenga
      # puede publicar en ese canal. El archivo de aprovisionamiento lo lee con
      # ${DISCORD_WEBHOOK_URL}.
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      # Enlace desde una alerta hacia el panel correspondiente.
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT:-3000}
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - microservices-net

networks:
  frontend-gateway-net:
    name: system_hr_frontend_gateway
  microservices-net:
    name: system_hr_microservices
  data-broker-net:
    name: system_hr_data_broker
    internal: true
  ci-network:
    name: ${CI_NETWORK:-system_hr_ci}

volumes:
  jenkins_home:
  sonar_credentials:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  sonar_db_data:


  # Los dashboards y las alertas se aprovisionan desde archivos versionados,
  # pero Grafana guarda aquí su base interna (usuarios, preferencias, estado de
  # las alertas). Sin el volumen se perdería el historial en cada reinicio.
  grafana-data:
    name: system-hr_grafana_data
  prometheus-data:
    name: system-hr_prometheus_data
  loki-data:
    name: system-hr_loki_data
  promtail-data:
    name: system-hr_promtail_data
