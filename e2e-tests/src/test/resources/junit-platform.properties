# Configuración de Cucumber sobre la plataforma JUnit.
#
# Los tres reportes se generan en rutas FIJAS porque el pipeline del Reto 7 va a
# apuntar exactamente a ellas:
#   reports/junit.xml      → resultados máquina-legibles (hace fallar el build)
#   reports/cucumber.json  → reporte estructurado para el plugin de Jenkins
#   reports/cucumber.html  → reporte navegable, en lenguaje de negocio

cucumber.glue=com.microservicios.e2e

# La selección de los .feature NO va aquí: con cucumber.features el motor los
# carga ante cualquier petición de descubrimiento y, junto con la clase @Suite,
# la suite se ejecutaba dos veces. La hace RunCucumberTest con
# @SelectClasspathResource("features").

cucumber.plugin=pretty, \
  html:reports/cucumber.html, \
  json:reports/cucumber.json, \
  junit:reports/junit.xml

# Los escenarios comparten estado en el sistema desplegado (un empleado creado
# por un escenario existe para los demás), así que se ejecutan en serie. El
# aislamiento se logra con identificadores únicos por escenario, no con paralelismo.
cucumber.execution.parallel.enabled=false

# Un paso sin implementar debe romper el build, no pasar en verde silenciosamente.
cucumber.execution.strict=true

# Evita el aviso de publicación en la nube de Cucumber en cada ejecución.
cucumber.publish.quiet=true

# Nombres de escenario legibles en el reporte de JUnit.
cucumber.junit-platform.naming-strategy=long
