server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: 3000
        # Allows the employee client's four attempts and exponential backoff.
        response-timeout: 45s
      routes:
        # Proveedor de identidad (Reto 5). /auth/login, /recover-password y
        # /reset-password son públicos; /change-password exige JWT.
        - id: auth-route
          uri: ${AUTH_URL:http://auth-service:8085}
          predicates:
            - Path=/auth,/auth/**
        - id: empleados-route
          uri: ${EMPLEADOS_URL:http://employees-service:8080}
          predicates:
            - Path=/empleados,/empleados/**
        - id: departamentos-route
          uri: ${DEPARTAMENTOS_URL:http://departments-service:8081}
          predicates:
            - Path=/departamentos,/departamentos/**
        # Sin StripPrefix: el servicio en Go registra sus rutas con el prefijo
        # puesto —"GET /notificaciones", "GET /notificaciones/empleado/{id}"— y
        # ademas sirve el alias /notifications. Quitarle el primer segmento
        # convertia GET /notificaciones en GET /, que cae en su manejador
        # comodin: el historial completo respondia 404 por el gateway aunque el
        # servicio estuviera sano y consumiendo eventos. La version anterior en
        # Node montaba sus rutas en la raiz y por eso lo necesitaba.
        - id: notificaciones-route
          uri: ${NOTIFICACIONES_URL:http://notifications-service:8082}
          predicates:
            - Path=/notificaciones,/notificaciones/**,/notifications,/notifications/**
        # El alias /perfiles lo sirve el propio profiles-service, igual que
        # vacations-service ya servía /vacaciones. No hace falta reescribir la ruta.
        - id: perfiles-route
          uri: ${PERFILES_URL:http://profiles-service:8083}
          predicates:
            - Path=/profiles,/profiles/**,/perfiles,/perfiles/**
        - id: vacaciones-route
          uri: ${VACACIONES_URL:http://vacations-service:8084}
          predicates:
            - Path=/vacations,/vacations/**,/vacaciones,/vacaciones/**

        # ── Contratos OpenAPI de cada servicio, para la Swagger UI agregada ──
        # Se exponen bajo /v3/api-docs/<servicio> y se reescriben a la ruta real
        # que publica cada microservicio.
        - id: api-docs-auth
          uri: ${AUTH_URL:http://auth-service:8085}
          predicates:
            - Path=/v3/api-docs/auth
          filters:
            - SetPath=/v3/api-docs
        - id: api-docs-empleados
          uri: ${EMPLEADOS_URL:http://employees-service:8080}
          predicates:
            - Path=/v3/api-docs/empleados
          filters:
            - SetPath=/v3/api-docs
        - id: api-docs-departamentos
          uri: ${DEPARTAMENTOS_URL:http://departments-service:8081}
          predicates:
            - Path=/v3/api-docs/departamentos
          filters:
            # /openapi.json y no /docs/openapi.json: departments-service se
            # reconstruyó en Python con FastAPI, que sirve el contrato en esa
            # ruta de fábrica. La versión en Node lo exponía bajo /docs porque
            # el documento se escribía a mano en un archivo aparte.
            - SetPath=/openapi.json
        # Los tres servicios de Node y Go publican su contrato en
        # /openapi.json, igual que el de Python. Faltaban aquí, así que desde el
        # host solo se podían leer tres de los siete contratos: el desplegable
        # del borde no los listaba y no había ruta para alcanzarlos.
        - id: api-docs-perfiles
          uri: ${PERFILES_URL:http://profiles-service:8083}
          predicates:
            - Path=/v3/api-docs/perfiles
          filters:
            - SetPath=/openapi.json
        - id: api-docs-vacaciones
          uri: ${VACACIONES_URL:http://vacations-service:8084}
          predicates:
            - Path=/v3/api-docs/vacaciones
          filters:
            - SetPath=/openapi.json
        - id: api-docs-notificaciones
          uri: ${NOTIFICACIONES_URL:http://notifications-service:8082}
          predicates:
            - Path=/v3/api-docs/notificaciones
          filters:
            - SetPath=/openapi.json

jwt:
  # Mismo secreto simétrico con el que auth-service firma. Se inyecta por
  # variable de entorno desde docker-compose; nunca va quemado en el código.
  secret: ${JWT_SECRET:cambie-este-secreto-de-desarrollo-por-uno-de-32-bytes-o-mas}
  issuer: ${JWT_ISSUER:system-hr-auth}

gateway:
  security:
    # Rutas sin token: las necesarias para obtener uno, salud y documentación.
    public-paths:
      - /auth/login
      - /auth/recover-password
      - /auth/reset-password
      - /health
      - /actuator/**
      - /swagger-ui.html
      - /swagger-ui/**
      - /webjars/**
      - /v3/api-docs/**

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # Una sola interfaz en el borde con un desplegable por microservicio.
    urls:
      - name: 1. auth-service
        url: /v3/api-docs/auth
      - name: 2. employees-service
        url: /v3/api-docs/empleados
      - name: 3. departments-service
        url: /v3/api-docs/departamentos
      - name: 4. profiles-service
        url: /v3/api-docs/perfiles
      - name: 5. vacations-service
        url: /v3/api-docs/vacaciones
      - name: 6. notifications-service
        url: /v3/api-docs/notificaciones

# ── Observabilidad (Reto 8) ──────────────────────────────────────────────────
# El gateway es el primer objetivo de Prometheus y el más valioso: al ser el
# único punto de entrada, su latencia y su tasa de error son lo más parecido a
# lo que percibe el cliente. Un servicio interno lento se nota aquí antes que
# en ningún otro sitio.
#
# /actuator/** ya está en gateway.security.public-paths, así que Prometheus
# puede raspar sin token. Si no lo estuviera, el propio filtro de JWT del
# gateway respondería 401 al recolector y el target aparecería caído.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,300ms,500ms,1s,2s
  tracing:
    sampling:
      # 100% en desarrollo y QA. En producción sería 10-20% head-based, o
      # tail-based en un OTel Collector para no perder las trazas con error.
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}
  zipkin:
    tracing:
      # Nombre de red de Docker, no localhost.
      endpoint: ${ZIPKIN_ENDPOINT:http://zipkin:9411/api/v2/spans}

resilience4j:
  circuitbreaker:
    instances:
      employeesService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        minimumNumberOfCalls: 10
        waitDurationInOpenState: 10s
        # Un 404 es una comunicación exitosa: el servicio respondió y dijo que
        # ese empleado no existe. Contarlo como fallo haría que una ráfaga de
        # ids inventados abriera el circuito y dejara sin servicio al endpoint
        # agregado. El 404 sigue propagándose al cliente; solo no cuenta aquí.
        ignoreExceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException$NotFound
      profilesService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        minimumNumberOfCalls: 10
        waitDurationInOpenState: 10s
      vacationsService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        minimumNumberOfCalls: 10
        waitDurationInOpenState: 10s
