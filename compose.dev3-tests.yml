# Entorno aislado y sin puertos públicos. No usa los datos del Compose principal.
name: system-hr-dev3-tests
services:
  postgres-notifications:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notifications_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: ${TEST_SECRET:?Ejecute scripts/probar-desarrollador3.ps1}
    healthcheck:
      test: [CMD-SHELL, pg_isready -U test -d notifications_test]
      interval: 2s
      timeout: 3s
      retries: 30
  postgres-vacations:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vacations_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: ${TEST_SECRET:?Ejecute scripts/probar-desarrollador3.ps1}
    healthcheck:
      test: [CMD-SHELL, pg_isready -U test -d vacations_test]
      interval: 2s
      timeout: 3s
      retries: 30
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: test
      RABBITMQ_DEFAULT_PASS: ${TEST_SECRET:?Ejecute scripts/probar-desarrollador3.ps1}
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 3s
      timeout: 5s
      retries: 30
  notifications-tests:
    build:
      context: ./services/notifications-service
      target: build
    environment:
      DATABASE_URL: postgresql://test:${TEST_SECRET}@postgres-notifications:5432/notifications_test?sslmode=disable
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: test
      RABBITMQ_PASSWORD: ${TEST_SECRET}
    volumes:
      - ./services/notifications-service/reports:/app/reports
    command:
      - sh
      - -ec
      - |
        mkdir -p reports
        go test -tags=integration -coverprofile=reports/coverage.out ./...
        go tool cover -func=reports/coverage.out | tee reports/coverage.txt
        awk '/total:/ {gsub("%","",$$3); found=1; if ($$3<70) exit 1} END {if (!found) exit 1}' reports/coverage.txt
  vacations-tests:
    build:
      context: ./services/vacations-service
      target: deps
    environment:
      DATABASE_URL: postgresql://test:${TEST_SECRET}@postgres-vacations:5432/vacations_test
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: test
      RABBITMQ_PASSWORD: ${TEST_SECRET}
    volumes:
      - ./services/vacations-service/reports:/app/reports
    command: [sh, -ec, "npm test && npm run test:integration"]
